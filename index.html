<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卓報告</title>
<meta name="description" content="TRPGの卓報告を一覧で見られます。"><meta property="og:type" content="website"><meta property="og:site_name" content="卓報告"><meta property="og:title" content="卓報告"><meta property="og:description" content="TRPGの卓報告を一覧で見られます。"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style id="css">
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1f2328; --muted:#6b7178; --line:#dde1e5; --accent:#2b2f36; --accent-ink:#ffffff; --soft:#f0f2f4;
  --lost:#9a4a44; --lost-bg:#f5e6e4; --ok:#46629a; --ok-bg:#e6ebf5; --warn:#7a6334; --warn-bg:#f3eddf;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1e2125; --ink:#e6e8ea; --muted:#9aa0a6; --line:#30343a; --accent:#d5d9de; --accent-ink:#15171a; --soft:#272b30;
  --lost:#d9958d; --lost-bg:#3a2624; --ok:#93aee0; --ok-bg:#212a3d; --warn:#d2b77a; --warn-bg:#352e20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#e6e8ea; --muted:#9aa0a6; --line:#30343a; --accent:#d5d9de; --accent-ink:#15171a; --soft:#272b30;
  --lost:#d9958d; --lost-bg:#3a2624; --ok:#93aee0; --ok-bg:#212a3d; --warn:#d2b77a; --warn-bg:#352e20; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:880px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{margin-bottom:28px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.24em;color:var(--muted);margin:0 0 10px}
.eyebrow::before{content:"";width:36px;height:1.5px;background:var(--ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:.06em;margin:0;line-height:1.3}
h1 svg{width:.8em;height:.8em;vertical-align:-.06em;margin-right:.3em}
header p{margin:8px 0 0;color:var(--muted);font-size:14px}
svg.i{width:1.1em;height:1.1em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,.filebtn{font-family:var(--f-body);font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.5}
button:hover,.filebtn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;border-radius:6px}
button.danger:hover{border-color:var(--lost);color:var(--lost)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
input[type=file]{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=search],select,textarea{font-family:var(--f-body);font-size:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.bar .grow{flex:1 1 200px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 18px}
.seg button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.seg .m{font-family:var(--f-mono);font-size:11px;opacity:.75}
.back{display:inline-block;margin-bottom:6px;font-size:13px;color:var(--muted);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.back:hover{color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.list{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;width:100%;height:100%;text-align:left;padding:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;color:inherit;font:inherit}
.card,.card *{text-align:left}
.card{align-items:stretch;justify-content:flex-start}
.card .cover,.card .cbody{width:100%}
.cover{position:relative}
.cover h2{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 10px;color:var(--ink)}
.cover h2.on{color:#fff;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0));text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cover{aspect-ratio:16/9;background:var(--soft);display:grid;place-items:center;color:var(--muted);overflow:hidden;border-bottom:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.blk{font-size:13px;line-height:1.5}
.blk b{display:block;font-size:12px;letter-spacing:.04em}
.blk span{display:block;color:var(--muted)}
.cfoot{margin-top:auto;font-size:13px}
.cfoot .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.card:hover{border-color:var(--accent)}
.card h2{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.04em;margin:0;line-height:1.4}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px}
.meta .m{font-family:var(--f-mono);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 9px;background:var(--soft)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:32px 20px;color:var(--muted);text-align:left}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.04em;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.lab{font-weight:700;font-size:13px}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.phead{font-size:11px;color:var(--muted);letter-spacing:.06em}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column}
.shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;cursor:zoom-in}
.shot .cap{padding:6px 8px;display:flex;gap:4px;align-items:center;background:var(--surface);border-top:1px solid var(--line)}
.shot .cap input{border:0;padding:2px 4px;font-size:12px;background:transparent}
.shot .cap p{margin:0;font-size:12px;color:var(--muted)}
.drop{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted);text-align:left;font-size:13px}
.drop.on{border-color:var(--accent);color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
table.pt{width:100%;border-collapse:collapse;font-size:14px}
table.pt th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px;letter-spacing:.06em;border-bottom:1px solid var(--line)}
table.pt td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.pt tr:last-child td{border-bottom:0}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
dl.info dt{color:var(--muted);font-size:13px}
dl.info dd{margin:0;font-weight:500}
.read{margin-top:6px}
.read+.actions{margin-top:32px}
.hero{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.hero:not(.has){border:0;background:none;border-radius:0}
.hero img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;cursor:zoom-in}
.hero h2{font-family:var(--f-display);font-weight:800;letter-spacing:.04em;line-height:1.35;margin:0;font-size:clamp(24px,5vw,34px)}
.hero.has h2{position:absolute;left:0;right:0;bottom:0;padding:48px 22px 18px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0));text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin:14px 2px 0;color:var(--muted);font-size:14px}
.rmeta .m{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.rmeta .res{color:var(--ink);font-weight:700;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:13px;background:var(--soft)}
.credits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin:28px 2px 0;padding-top:24px;border-top:1px solid var(--line)}
.credits section{min-width:0}
.credits h3,.gal h3{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.credits p{margin:0;font-size:15px;line-height:1.8}
.gal{margin:32px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.gal>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gal figure{margin:0}
.gal img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.gal figcaption{font-size:13px;color:var(--muted);margin-top:6px}
@media (max-width:620px){.credits{grid-template-columns:minmax(0,1fr);gap:20px}.gal>div{grid-template-columns:minmax(0,1fr)}.hero.has h2{padding:36px 14px 12px}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
dialog{border:0;background:transparent;padding:0;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog img{max-width:96vw;max-height:92vh;display:block;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:6px;font-size:13px;z-index:9}
footer{margin-top:36px;font-size:12px;color:var(--muted)}
@media (max-width:620px){
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr)}
  .phead{display:none}
}
@media print{.noprint{display:none!important}.wrap{padding:0}.card,.panel{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">SESSION REPORT</p>
    <h1><svg class="i" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>卓報告</h1>
    <p>これまでの卓の報告です。カードを開くと詳細を見られ、報告文のコピーもできます。</p>
  </header>
  <main id="app"></main>
  <footer class="noprint" id="foot"></footer>
</div>
<dialog id="lb"><img alt=""></dialog>
<dialog id="tk" style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:min(480px,92vw)">
  <form method="dialog">
    <h3 style="font-family:var(--f-display);font-weight:800;margin:0 0 8px">GitHub連携</h3>
    <p class="note" style="margin:0 0 10px">保存先のリポジトリ <b>enoel-eno/session-log</b> だけに、<b>Contents: Read and write</b> の権限を付けたトークンを作って貼り付けてください。<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--ink)">トークンを作る</a>　このブラウザの中にだけ保存されます。</p>
    <p class="note" id="tk-state" style="margin:0 0 8px"></p>
    <input type="password" id="tk-in" placeholder="github_pat_…" autocomplete="off" aria-label="トークン">
    <div class="actions"><button class="primary" value="ok">保存</button><button value="clear" class="danger">解除</button><button value="cancel">閉じる</button></div>
  </form>
</dialog>
<datalist id="rlist"><option value="全員生還"><option value="両生還"><option value="一部ロスト"><option value="全ロスト"></datalist>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC = {
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  ul:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  img:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  save:'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---- 保存先: GitHub（データ本体と表紙画像をこのリポジトリにコミットする） ---- */
const REPO = 'enoel-eno/session-log', BRANCH = 'main', DATA = 'takuhokoku-data.json', TOKEN_KEY = 'takuhokoku-token';
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(_){ return ''; } };
const setToken = t => { try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(_){} };
const b64 = s => { const b = new TextEncoder().encode(s); let t = ''; for(let i = 0; i < b.length; i += 0x8000) t += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function gh(path, opt = {}){
  const url = `https://api.github.com/repos/${REPO}/contents/${path}` + (opt.method ? '' : `?ref=${BRANCH}&t=${Date.now()}`);
  const r = await fetch(url, {...opt, headers:{Accept:'application/vnd.github+json', Authorization:'Bearer ' + getToken()}});
  if(r.status === 404 && !opt.method) return null;
  if(!r.ok) throw new Error(r.status === 401 ? 'トークンが正しくないか、期限が切れています' : r.status === 403 ? 'このリポジトリに書き込む権限がありません' : r.status === 409 || r.status === 422 ? '他で更新されています。ページを開き直してやり直してください' : `GitHub のエラー（${r.status}）`);
  return r.json();
}
// 画像は images/ に別ファイルでコミットし、データ側にはパスだけを書く
// 共有用ページ：SNS などに URL を貼るとスクショ付きのカードになる（r/<id>.html。開くと本体のページへ移る）
const SITE = 'https://enoel-eno.github.io/session-log/';
const shareUrl = r => `${SITE}r/${r.id}.html`;
function sharePage(r){
  const cv = r.shots[0], img = cv ? SITE + (cv.path || cv.data) : '';
  const desc = [r.kpc ? `${r.kpc} - ${r.gm}` : r.gm, fmtDate(r.date)].filter(Boolean).join(' / ');
  const t = esc(r.title || '卓報告'), d = esc(desc), to = `../?r=${encodeURIComponent(r.id)}`;
  return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>${t}</title>
<meta name="description" content="${d}"><meta property="og:type" content="article"><meta property="og:site_name" content="卓報告"><meta property="og:title" content="${t}"><meta property="og:description" content="${d}"><meta property="og:url" content="${esc(shareUrl(r))}">${img ? `<meta property="og:image" content="${esc(img)}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="${esc(img)}">` : '<meta name="twitter:card" content="summary">'}
<meta http-equiv="refresh" content="0;url=${to}"><script>location.replace(${JSON.stringify(to)})<\/script></head><body><a href="${to}">${t}</a></body></html>`;
}
async function putFile(path, content, message){
  const cur = await gh(path);
  await gh(path, {method:'PUT', body: JSON.stringify({message, content, branch: BRANCH, ...(cur ? {sha: cur.sha} : {})})});
}
async function publish(message, saved, removedId){
  for(const r of reports) for(const s of r.shots){
    if(!s.data.startsWith('data:')) continue;
    const path = `images/${s.id}.jpg`, cur = await gh(path);
    await gh(path, {method:'PUT', body: JSON.stringify({message, content: s.data.split(',')[1], branch: BRANCH, ...(cur ? {sha: cur.sha} : {})})});
    s.path = path;
  }
  const out = {version:1, reports: reports.map(r => ({...r, shots: r.shots.map(s => ({id: s.id, caption: s.caption, data: s.path || s.data}))}))};
  const cur = await gh(DATA);
  await gh(DATA, {method:'PUT', body: JSON.stringify({message, content: b64(JSON.stringify(out)), branch: BRANCH, ...(cur ? {sha: cur.sha} : {})})});
  if(saved) await putFile(`r/${saved.id}.html`, b64(sharePage(saved)), message);
  if(removedId){ const f = await gh(`r/${removedId}.html`); if(f) await gh(`r/${removedId}.html`, {method:'DELETE', body: JSON.stringify({message, sha: f.sha, branch: BRANCH})}); }
}

/* ---- state ---- */
// 通常は閲覧専用。URL に ?edit を付けて開くと編集できる（保存にはトークンが必要）
const EDIT = /[?&]edit\b/.test(location.search);
let reports = [], view = {name:'list'}, draft = null, query = '', role = 'all';
const isKp = r => /えの|eno/i.test(r.gm || "");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const blank = () => ({id: uid(), title:'', date: today(), gm:'', kpc:'', result:'', table:'', system:'Call of Cthulhu', players:[{ho:'HO1', pl:'', pc:''}], shots:[], created: Date.now()});
const fmtDate = d => d ? d.replace(/-/g, '/') : '日付なし';

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('コピーしました'); }catch(_){ toast('コピーできませんでした'); }
    ta.remove();
  }
}
// 報告文の見出しは Unicode の太字サンセリフ（𝗞𝗣 など）にする
const bold = t => [...t].map(c => { const n = c.charCodeAt(0);
  return n >= 65 && n <= 90 ? String.fromCodePoint(0x1D5D4 + n - 65) : n >= 97 && n <= 122 ? String.fromCodePoint(0x1D5EE + n - 97) : n >= 48 && n <= 57 ? String.fromCodePoint(0x1D7EC + n - 48) : c; }).join('');
function reportText(r){
  const blocks = [];
  blocks.push((r.system ? bold(r.system.toLowerCase()) + '\n' : '') + (r.title || '無題'));
  if(r.gm || r.kpc) blocks.push(bold(r.kpc ? roleLabel(r) : (r.role || 'KP')) + '\n' + (r.kpc ? r.kpc + ' - ' + r.gm : r.gm));
  const ps = r.players.filter(p => p.pl || p.pc);
  if(ps.length) blocks.push([bold('PC - PL'), ...ps.map(pcLine)].join('\n'));
  blocks.push(fmtDate(r.date));
  blocks.push(shareUrl(r));
  return blocks.join('\n\n');
}

/* ---- images ---- */
function fileToShot(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const M = 1600, k = Math.min(1, M / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({id: uid(), caption:'', data: c.toDataURL('image/jpeg', .88)});
    };
    im.onerror = () => { URL.revokeObjectURL(url); res(null); };
    im.src = url;
  });
}
async function addFiles(files){
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if(!imgs.length) return;
  syncDraft();
  for(const f of imgs){ const s = await fileToShot(f); if(s) draft.shots.push(s); }
  renderEdit(); toast(`${imgs.length}枚を追加しました`);
}

/* ---- views ---- */
const app = $('#app');
function render(){
  if(view.name === 'list') renderList();
  else if(view.name === 'edit') renderEdit();
  else renderDetail();
  window.scrollTo(0, 0);
}
function go(v){ view = v; render(); }

function playerChips(r){
  return r.players.filter(p => p.pc || p.pl).map(p =>
    `<span class="chip">${esc(p.pc || p.pl)}</span>`).join('');
}

// KP/DL の呼び分け（DL のときの NPC は DPC）
const roleLabel = r => r.role === 'DL' ? 'DPC - DL' : 'KPC - KP';
const pcLine = p => [[p.ho, p.pc].filter(Boolean).join(' '), p.pl].filter(Boolean).join(' - ');
function card(r){
  const ps = r.players.filter(p => p.pc || p.pl);
  const cv = r.shots[0];
  return `<li><button class="card" data-open="${r.id}">
    <div class="cover">${cv ? `<img src="${cv.data}" alt="">` : ''}<h2 class="${cv ? 'on' : ''}">${esc(r.title || '無題')}</h2></div>
    <div class="cbody">
      ${r.gm || r.kpc ? `<div class="blk"><b>${r.kpc ? roleLabel(r) : (r.role || 'KP')}</b><span>${esc(r.kpc ? r.kpc + ' - ' + r.gm : r.gm)}</span></div>` : ''}
      ${ps.length ? `<div class="blk"><b>PC - PL</b>${ps.map(p => `<span>${esc(pcLine(p))}</span>`).join('')}</div>` : ''}
      <div class="cfoot"><span class="m">${fmtDate(r.date)}</span>${esc(r.result)}</div>
    </div></button></li>`;
}
function renderList(){
  const q = query.trim().toLowerCase();
  const sorted = reports.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
  const cnt = {all: sorted.length, kp: sorted.filter(isKp).length};
  cnt.pl = cnt.all - cnt.kp;
  const rows = sorted
    .filter(r => role === 'all' || (role === 'kp') === isKp(r))
    .filter(r => !q ||[r.title, r.gm, r.kpc, r.result, r.table, r.system, ...r.players.flatMap(p => [p.pl, p.pc, p.ho])].join(' ').toLowerCase().includes(q));
  app.innerHTML = `
    <div class="bar noprint">
      <input class="grow" type="search" id="q" placeholder="シナリオ名・GM・PL・PC名で検索" value="${esc(query)}" aria-label="検索">
      ${EDIT ? `<button class="primary" data-act="new">${ico('plus')}新しい報告</button>` : ''}
    </div>
    <div class="seg noprint" role="group" aria-label="絞り込み">${[['all', 'すべて'], ['kp', 'KP卓'], ['pl', 'PL卓']].map(([k, t]) => `<button type="button" data-role="${k}" aria-pressed="${role === k}">${t}<span class="m">${cnt[k]}</span></button>`).join('')}</div>
    ${rows.length ? `<ul class="list">${rows.map(card).join('')}</ul>`
      : `<div class="empty">${reports.length ? '該当する報告がありません。' : 'まだ報告がありません。'}</div>`}
    ${EDIT ? `<div class="actions noprint"><button data-act="token">${ico('save')}GitHub連携（${getToken() ? '設定済み' : '未設定'}）</button></div>` : ''}`;
  app.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => { role = b.dataset.role; renderList(); }));
  const qi = $('#q');
  qi.addEventListener('input', () => { query = qi.value; const pos = qi.selectionStart; renderList(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
}

function renderDetail(){
  const r = reports.find(x => x.id === view.id);
  if(!r) return go({name:'list'});
  const ps = r.players.filter(p => p.pl || p.pc), cv = r.shots[0], rest = r.shots.slice(1);
  const meta = [r.system, r.table].filter(Boolean);
  app.innerHTML = `
    <button class="back noprint" data-act="list">← 一覧に戻る</button>
    <article class="read">
      <div class="hero${cv ? ' has' : ''}">${cv ? `<img src="${cv.data}" alt="" data-zoom="${cv.id}">` : ''}<h2>${esc(r.title || '無題')}</h2></div>
      <p class="rmeta"><span class="m">${fmtDate(r.date)}</span>${meta.map(t => `<span>${esc(t)}</span>`).join('')}${r.result ? `<span class="res">${esc(r.result)}</span>` : ''}</p>
      <div class="credits">
        ${r.gm || r.kpc ? `<section><h3>${r.kpc ? roleLabel(r) : (r.role || 'KP')}</h3><p>${esc(r.kpc ? r.kpc + ' - ' + r.gm : r.gm)}</p></section>` : ''}
        ${ps.length ? `<section><h3>PC - PL</h3>${ps.map(p => `<p>${esc(pcLine(p))}</p>`).join('')}</section>` : ''}
      </div>
      ${rest.length ? `<section class="gal"><h3>スクリーンショット</h3><div>${rest.map(s =>
        `<figure><img src="${s.data}" alt="${esc(s.caption || 'スクリーンショット')}" data-zoom="${s.id}" loading="lazy">${s.caption ? `<figcaption>${esc(s.caption)}</figcaption>` : ''}</figure>`).join('')}</div></section>` : ''}
    </article>
    <div class="actions noprint">
      ${EDIT ? `<button class="primary" data-act="edit">${ico('edit')}編集</button>` : ''}
      <button data-act="copytext">${ico('copy')}報告文をコピー</button>
      ${EDIT ? `<button class="danger ghost" data-act="del" style="margin-left:auto">${ico('trash')}削除</button>` : ''}
    </div>`;
}

function renderEdit(){
  const r = draft;
  app.innerHTML = `
    <button class="back noprint" data-act="cancel">← 一覧に戻る</button>
    <form id="f" autocomplete="off">
      <div class="panel"><h3>基本情報</h3><div class="fgrid">
        <div class="field full"><label class="lab" for="f-title">シナリオ名</label><input type="text" id="f-title" value="${esc(r.title)}"></div>
        <div class="field"><label class="lab" for="f-date">日付</label><input type="date" id="f-date" value="${esc(r.date)}"></div>
        <div class="field"><label class="lab" for="f-system">システム</label><input type="text" id="f-system" value="${esc(r.system)}"></div>
        <div class="field"><label class="lab" for="f-table">卓名</label><input type="text" id="f-table" value="${esc(r.table)}"></div>
        <div class="field"><label class="lab" for="f-gm">KP / DL</label><div style="display:flex;gap:6px"><select id="f-role" style="width:76px;flex:none" aria-label="呼び方"><option ${r.role !== 'DL' ? 'selected' : ''}>KP</option><option ${r.role === 'DL' ? 'selected' : ''}>DL</option></select><input type="text" id="f-gm" value="${esc(r.gm)}"></div></div>
        <div class="field"><label class="lab" for="f-kpc">KPC（任意）</label><input type="text" id="f-kpc" value="${esc(r.kpc)}"></div>
        <div class="field"><label class="lab" for="f-result">結果</label><input type="text" id="f-result" value="${esc(r.result)}" list="rlist" placeholder="例：両生還"></div>
      </div></div>

      <div class="panel"><h3>参加者とPC</h3>
        <div class="plist">
          <div class="prow phead"><span>HO</span><span>PC（探索者）</span><span>PL</span><span></span></div>
          ${r.players.map((p, i) => `<div class="prow">
            <input type="text" data-p="ho" data-i="${i}" value="${esc(p.ho)}" aria-label="HO" placeholder="HO1">
            <input type="text" data-p="pc" data-i="${i}" value="${esc(p.pc)}" aria-label="PC名" placeholder="PC名">
            <input type="text" data-p="pl" data-i="${i}" value="${esc(p.pl)}" aria-label="PL名" placeholder="PL名">
            <button type="button" class="ghost" data-delp="${i}" aria-label="この行を削除">${ico('x')}</button></div>`).join('')}
        </div>
        <div class="actions"><button type="button" data-act="addp">${ico('plus')}参加者を追加</button></div>
      </div>

      <div class="panel"><h3>スクリーンショット</h3>
        <div class="drop" id="drop">画像をここにドラッグ、または貼り付け（Ctrl/⌘+V）<br>
          <label class="filebtn" style="margin-top:8px">${ico('img')}画像を選ぶ<input type="file" id="pick" accept="image/*" multiple></label></div>
        <p class="note">長辺1600pxに縮小して保存します。先頭の画像が一覧の表紙になります。</p>
        ${r.shots.length ? `<div class="shots">${r.shots.map((s, i) => `<div class="shot"><img src="${s.data}" alt="" data-zoom="${s.id}">
          <div class="cap"><input type="text" data-cap="${i}" value="${esc(s.caption)}" placeholder="キャプション（任意）" aria-label="キャプション">${i ? `<button type="button" class="ghost" data-cover="${i}" title="表紙にする" aria-label="表紙にする">${ico('up')}</button>` : ''}<button type="button" class="ghost" data-dels="${i}" aria-label="画像を削除">${ico('x')}</button></div></div>`).join('')}</div>` : ''}
      </div>

      <div class="actions"><button type="submit" class="primary">${ico('save')}保存</button><button type="button" data-act="cancel">キャンセル</button></div>
    </form>`;
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); syncDraft();
    if(!getToken()) return openToken();
    const prev = reports.slice(), i = reports.findIndex(x => x.id === draft.id), btn = e.submitter, label = btn.innerHTML;
    i < 0 ? reports.push(draft) : reports[i] = draft;
    btn.disabled = true; btn.textContent = '保存中…';
    try{ await publish(`卓報告：${draft.title || '無題'}を${i < 0 ? '追加' : '更新'}`, draft); toast('保存しました。公開ページへの反映には1分ほどかかります'); go({name:'detail', id: draft.id}); }
    catch(err){ reports = prev; btn.disabled = false; btn.innerHTML = label; alert('保存できませんでした：' + err.message); }
  });
  $('#pick').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter','dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('on'); }));
  ['dragleave','drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
}
function syncDraft(){
  if(!$('#f-title')) return;
  draft.title = $('#f-title').value.trim(); draft.date = $('#f-date').value;
  draft.system = $('#f-system').value.trim(); draft.table = $('#f-table').value.trim(); draft.gm = $('#f-gm').value.trim(); draft.kpc = $('#f-kpc').value.trim(); draft.role = $('#f-role').value; draft.result = $('#f-result').value.trim();
  document.querySelectorAll('[data-p]').forEach(el => { draft.players[+el.dataset.i][el.dataset.p] = el.value.trim(); });
  document.querySelectorAll('[data-cap]').forEach(el => { draft.shots[+el.dataset.cap].caption = el.value.trim(); });
}

/* ---- export ---- */
function openToken(){
  $('#tk-in').value = ''; $('#tk-state').textContent = getToken() ? '設定済みです（入力すると置き換えます）。' : '未設定です。';
  $('#tk').showModal();
}

/* ---- events ---- */
document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]');
  if(z){ const lb = $('#lb'); lb.querySelector('img').src = z.src; lb.showModal(); return; }
  const open = e.target.closest('[data-open]');
  if(open) return go({name:'detail', id: open.dataset.open});
  const dp = e.target.closest('[data-delp]');
  if(dp){ syncDraft(); draft.players.splice(+dp.dataset.delp, 1); if(!draft.players.length) draft.players.push({ho:'HO1', pl:'', pc:''}); return renderEdit(); }
  const cv = e.target.closest('[data-cover]');
  if(cv){ syncDraft(); draft.shots.unshift(...draft.shots.splice(+cv.dataset.cover, 1)); return renderEdit(); }
  const ds = e.target.closest('[data-dels]');
  if(ds){ syncDraft(); draft.shots.splice(+ds.dataset.dels, 1); return renderEdit(); }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const r = reports.find(x => x.id === view.id);
  switch(b.dataset.act){
    case 'new': draft = blank(); go({name:'edit'}); break;
    case 'list': go({name:'list'}); break;
    case 'edit': draft = structuredClone(r); go({name:'edit'}); break;
    case 'cancel': go(reports.some(x => x.id === draft.id) ?{name:'detail', id: draft.id} : {name:'list'}); break;
    case 'addp': syncDraft(); draft.players.push({ho:'HO' + (draft.players.length + 1), pl:'', pc:''}); renderEdit(); break;
    case 'copytext': copy(reportText(r)); break;
    case 'del':
      if(!getToken()) return openToken();
      if(confirm(`「${r.title || '無題'}」を削除します。`)){
        const prev = reports.slice(); reports = reports.filter(x => x.id !== r.id);
        try{ await publish(`卓報告：${r.title || '無題'}を削除`, null, r.id); go({name:'list'}); toast('削除しました'); }
        catch(err){ reports = prev; alert('削除できませんでした：' + err.message); }
      }
      break;
    case 'token': openToken(); break;
  }
});
$('#lb').addEventListener('click', () => $('#lb').close());
document.addEventListener('paste', e => {
  if(view.name !== 'edit') return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); addFiles(files); }
});

$('#tk').addEventListener('submit', e => {
  const v = $('#tk-in').value.trim(), act = e.submitter && e.submitter.value;
  if(act === 'cancel') return;
  if(act === 'clear') setToken(''); else if(v){ setToken(v); location.reload(); return; }
  if(view.name === 'list') renderList();
});
$('#foot').textContent = EDIT ? '編集モード：保存するとGitHubにコミットされ、公開ページには1分ほどで反映されます。' : '';
(async () => {
  let doc = null;
  // 編集時はGitHubの最新を読む（公開ページは反映まで時間がかかるため）
  if(EDIT && getToken()){ try{ const f = await gh(DATA); if(f) doc = JSON.parse(unb64(f.content)); }catch(err){ toast(err.message); } }
  if(!doc){ try{ const r = await fetch(DATA + '?t=' + Date.now()); if(r.ok) doc = await r.json(); }catch(_){} }
  reports = (doc && doc.reports) || [];
  const rid = new URLSearchParams(location.search).get('r');
  if(rid && reports.some(x => x.id === rid)) view = {name:'detail', id: rid};
  render();
  if(EDIT && !getToken()) toast('保存するには「GitHub連携」でトークンを設定してください');
})();
</script>
